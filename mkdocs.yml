site_name: Pokemon Astral Warp
site_url: https://.github.io/pokemon-astral-warp
site_description: Wikipedia Page for the fan-game Pokemon Astral Warp
site_author: justPauw
repo_url: https://github.com/justPauw/pokemon-astral-warp
theme:
  name: material
  features:
  - content.tabls.links
  - content.tooltips
  favicon: img/items/premier-ball.png
  palette:
  - media: '(prefers-color-scheme: light)'
    primary: black
    scheme: default
    toggle:
      icon: material/eye-outline
      name: Switch to dark mode
  - media: '(prefers-color-scheme: dark)'
    primary: black
    scheme: slate
    toggle:
      icon: material/eye
      name: Switch to light mode
nav:
- Home: index.md
- Ability Changes: ability_changes.md
- Item Changes: item_changes.md
- Pokemon:
  - 001 - Lycanode: pokemon/001-lycanode.md
  - 511 - Pansage: pokemon/511-pansage.md
  - 512 - Simisage: pokemon/512-simisage.md
  - 513 - Pansear: pokemon/513-pansear.md
  - 514 - Simisear: pokemon/514-simisear.md
  - 515 - Panpour: pokemon/515-panpour.md
  - 516 - Simipour: pokemon/516-simipour.md
- Routes: []
plugins:
- search:
    lang: en
markdown_extensions:
- admonition
- abbr
- attr_list
- pymdownx.snippets
- pymdownx.superfences
- pymdownx.details
- pymdownx.tasklist:
    custom_checkbox: true
- pymdownx.tabbed:
    alternate_style: true
extra_css:
- stylesheets/extra.css
